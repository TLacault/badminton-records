name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit — useful
  # after changing Supabase data that prerendered pages bake in.
  workflow_dispatch:

# Pages needs to read the repo, mint an OIDC token, and write a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a queued run finishes
# rather than leaving the site on a half-published artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Resolves where the site will actually live: `/badminton-records/` for
      # a project site, `/` once a custom domain is attached. Nuxt reads the
      # result from NUXT_APP_BASE_URL below, so neither case needs a code edit.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # Baked into the client bundle at build time. The anon key is meant
          # to be public; row-level security is what actually guards the data.
          NUXT_PUBLIC_SUPABASE_URL: ${{ vars.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
        run: pnpm generate

      # Pages serves through Jekyll unless told otherwise, and Jekyll drops
      # directories beginning with an underscore — which is every built asset.
      - name: Disable Jekyll
        run: touch .output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
