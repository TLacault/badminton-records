<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"colour","type":"color","label":"Family colour","default":"#cb2543"},
    {"id":"tag","type":"string","label":"Family tag","default":"TOURNOIS"},
    {"id":"event","type":"string","label":"Event line","default":"TOURNOIS DES VENDANGES 2026"},
    {"id":"detail","type":"string","label":"Discipline • round","default":"DOUBLES HOMMES • QUARTS DE FINALE"},
    {"id":"s1","type":"string","label":"Side 1","default":"TIM & ADRIEN"},
    {"id":"s2","type":"string","label":"Side 2","default":"THOMAS & ANTHONY"}
  ]'
>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Barlow Condensed BR"; src: url("assets/fonts/BarlowCondensed-BlackItalic.ttf"); font-weight: 900; font-style: italic; }
  @font-face { font-family: "Poppins BR"; src: url("assets/fonts/Poppins-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
  html, body { margin: 0; background: #08070a; }
  /* 2.5 s vertical opener (SHORT_INTRO_SECONDS): the matchup is on frame 0, it is the hook. */
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #08070a; --c: #cb2543; color: #fff; }
  .full { position: absolute; inset: 0; }
  #bg { width: 100%; height: 100%; object-fit: cover; opacity: .5; }
  #shade { background: radial-gradient(80% 60% at 50% 45%, rgba(8,7,10,.5), rgba(8,7,10,.95)); }
  .slash { position: absolute; top: -300px; height: 2520px; background: var(--c); }
  #brand { position: absolute; left: 0; right: 0; top: 240px; display: flex; flex-direction: column; align-items: center; }
  #logo { height: 220px; }
  #word { margin-top: 10px; font: italic 900 84px/0.9 "Barlow Condensed BR"; text-transform: uppercase; }
  #word .red { color: var(--c); }
  #tag { position: absolute; left: 0; top: 650px; padding: 14px 60px 12px 70px; background: var(--c); font: italic 700 40px/1 "Poppins BR"; letter-spacing: 2px; clip-path: polygon(0 0, 100% 0, calc(100% - 30px) 100%, 0 100%); }
  #event { position: absolute; left: 60px; right: 60px; top: 760px; text-align: center; font: italic 700 48px/1.15 "Poppins BR"; letter-spacing: 2px; }
  #detail { position: absolute; left: 60px; right: 60px; top: 880px; text-align: center; font: italic 700 34px/1.1 "Poppins BR"; letter-spacing: 3px; color: var(--c); }
  .side { position: absolute; left: 40px; right: 40px; text-align: center; font: italic 900 120px/0.95 "Barlow Condensed BR"; text-transform: uppercase; }
  #s1 { top: 960px; }
  #vs { position: absolute; left: 0; right: 0; top: 1085px; text-align: center; font: italic 900 96px/1 "Barlow Condensed BR"; color: var(--c); }
  #s2 { top: 1185px; color: var(--c); }
  #wipe1 { left: 0; width: 700px; }
  #wipe2 { left: -300px; width: 1900px; background: #08070a; }
</style>
</head>
<body>
<div id="root" data-composition-id="short-intro" data-start="0" data-duration="2.5" data-width="1080" data-height="1920" data-fps="30">
  <img id="bg" class="full" src="assets/background.jpg" alt="">
  <div id="shade" class="full"></div>
  <div id="slashes" class="full" data-layout-allow-overflow data-layout-ignore>
    <div class="slash" id="sl1" style="left:-200px;width:150px;top:-60px;height:640px"></div>
    <div class="slash" id="sl2" style="right:-200px;width:150px;top:1340px;height:700px"></div>
  </div>

  <div id="brand"><img id="logo" src="assets/logo.png" alt=""><div id="word">Badminton <span class="red">Records</span></div></div>
  <div id="tag" data-var-text="tag">TOURNOIS</div>
  <div id="event" data-var-text="event">TOURNOIS DES VENDANGES 2026</div>
  <div id="detail" data-var-text="detail">DOUBLES HOMMES • QUARTS DE FINALE</div>
  <div id="s1" class="side" data-var-text="s1">TIM &amp; ADRIEN</div>
  <div id="vs">VS</div>
  <div id="s2" class="side" data-var-text="s2">THOMAS &amp; ANTHONY</div>

  <div id="wipe" class="full" data-layout-allow-overflow data-layout-ignore>
    <div class="slash" id="wipe1"></div>
    <div class="slash" id="wipe2"></div>
  </div>
</div>
<script src="assets/gsap-3.14.2.min.js"></script>
<script>
  const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  const root = document.getElementById("root");
  if (v.colour) root.style.setProperty("--c", v.colour);
  for (const id of ["event", "detail"]) {
    if (id in v && !String(v[id]).trim()) document.getElementById(id).style.display = "none";
  }
  // Long lines shrink to one line instead of wrapping into the next block.
  for (const [id, start, min] of [["s1", 120, 56], ["s2", 120, 56], ["event", 48, 28]]) {
    const el = document.getElementById(id);
    let size = start;
    el.style.whiteSpace = "nowrap";
    while (el.scrollWidth > el.clientWidth && size > min) {
      size -= 2;
      el.style.fontSize = `${size}px`;
    }
  }

  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#bg", { scale: 1.1 }, { scale: 1, duration: 2.5, ease: "none" }, 0);
  tl.fromTo("#sl1", { x: -300, skewX: -24 }, { x: 260, skewX: -24, duration: 0.35, ease: "expo.out" }, 0);
  tl.fromTo("#sl2", { x: 300, skewX: -24 }, { x: -260, skewX: -24, duration: 0.35, ease: "expo.out" }, 0);
  // The matchup is already up on frame 0 (it is the thumbnail); it lands harder in the first beat.
  tl.fromTo("#s1", { x: -120 }, { x: 0, duration: 0.4, ease: "expo.out" }, 0);
  tl.fromTo("#s2", { x: 120 }, { x: 0, duration: 0.4, ease: "expo.out" }, 0);
  tl.fromTo("#vs", { scale: 1.8 }, { scale: 1, duration: 0.3, ease: "expo.out" }, 0.08);
  tl.fromTo("#logo", { scale: 1.8, opacity: 0, filter: "blur(12px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.15);
  tl.fromTo("#word", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, ease: "power4.out" }, 0.35);
  tl.fromTo("#tag", { x: -600 }, { x: 0, duration: 0.35, ease: "expo.out" }, 0.4);
  tl.fromTo(["#event", "#detail"], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out", stagger: 0.08 }, 0.5);
  // Out: colour then ink sweep the frame; the first clip cuts in from black.
  tl.fromTo("#wipe1", { x: -1200, skewX: -24 }, { x: 1800, skewX: -24, duration: 0.4, ease: "power3.in" }, 2.0);
  tl.fromTo("#wipe2", { x: -2400, skewX: -24 }, { x: 0, skewX: -24, duration: 0.38, ease: "power3.in" }, 2.08);
  window.__timelines["short-intro"] = tl;
</script>
</body>
</html>
