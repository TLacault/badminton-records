<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"colour","type":"color","label":"Family colour","default":"#cb2543"},
    {"id":"mode","type":"string","label":"in = the bands build in (cut at 1.4 s, reversed before the outro); ambient = the 8 s loop behind the clips; still","default":"ambient"},
    {"id":"tag","type":"string","label":"Family tag","default":"TOURNOIS"},
    {"id":"event","type":"string","label":"Event line","default":"TOURNOIS DES VENDANGES 2026"},
    {"id":"detail","type":"string","label":"Discipline • round","default":"DOUBLES HOMMES • QUARTS DE FINALE"},
    {"id":"s1","type":"string","label":"Side 1","default":"TIM & ADRIEN"},
    {"id":"s2","type":"string","label":"Side 2","default":"THOMAS & ANTHONY"},
    {"id":"place","type":"string","label":"Venue · date","default":"TALENCE · 24 NOVEMBRE 2026"}
  ]'
>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Barlow Condensed BR"; src: url("assets/fonts/BarlowCondensed-BlackItalic.ttf"); font-weight: 900; font-style: italic; }
  @font-face { font-family: "Poppins BR"; src: url("assets/fonts/Poppins-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
  html, body { margin: 0; background: #08070a; }
  /*
   * The frame behind every clip of a vertical reel. The landscape match is laid
   * over the window (y 560 → 1168, full width; shared/reel SHORT_FRAME), so the
   * two bands carry the brand and the match: brand, event, discipline and players
   * above, tag and venue below, the outlined wordmark under them. Words stay in
   * the 168 → 1330 band the Shorts / Reels UI leaves alone.
   *
   * mode=ambient: an 8 s loop (every tween returns to where it started, or is
   * off screen at both ends) of slow floating motes, soft glows and a light
   * running along the window's edges. mode=in: the bands building in over 1.4 s
   * and landing exactly on the loop's first frame.
   * The background is the jumping player from brand/thumbnail/background.png,
   * cropped 9:16 (assets/portrait-bg.jpg) and darkened.
   */
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #08070a; --c: #cb2543; color: #fff; }
  .full { position: absolute; inset: 0; }
  #bg-wrap { overflow: hidden; }
  #bg { width: 100%; height: 100%; object-fit: cover; opacity: .72; }
  #shade { background: linear-gradient(180deg, rgba(8,7,10,.42) 0%, rgba(8,7,10,.55) 22%, rgba(8,7,10,.8) 29%, #08070a 50%, rgba(8,7,10,.62) 63%, rgba(8,7,10,.3) 82%, rgba(8,7,10,.5) 100%); }
  .slash { position: absolute; background: var(--c); }
  .orb { position: absolute; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 32%, transparent) 0%, transparent 68%); }
  .mote { position: absolute; border-radius: 50%; }
  #window { position: absolute; left: 0; right: 0; top: 560px; height: 608px; background: #000; border-top: 8px solid var(--c); border-bottom: 8px solid var(--c); margin-top: -8px; }
  .shine { position: absolute; width: 300px; height: 8px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }
  #shine-top { top: 552px; }
  #shine-bot { top: 1168px; }

  #brand { position: absolute; left: 0; right: 0; top: 180px; display: flex; align-items: center; justify-content: center; gap: 20px; }
  #logo { height: 92px; }
  #word { font: italic 900 68px/0.9 "Barlow Condensed BR"; text-transform: uppercase; letter-spacing: .01em; }
  #word .red { color: var(--c); }
  #event { position: absolute; left: 60px; right: 60px; top: 300px; text-align: center; font: italic 700 50px/1.1 "Poppins BR"; letter-spacing: 2px; white-space: nowrap; }
  #detail { position: absolute; left: 60px; right: 60px; top: 370px; text-align: center; font: italic 700 38px/1.1 "Poppins BR"; letter-spacing: 3px; color: var(--c); }
  #versus { position: absolute; left: 40px; right: 40px; top: 432px; display: flex; justify-content: center; align-items: baseline; gap: 26px; font: italic 900 80px/1.1 "Barlow Condensed BR"; text-transform: uppercase; white-space: nowrap; }
  #vs { font-size: 54px; color: var(--c); }
  #tag { position: absolute; left: 0; top: 1200px; padding: 12px 56px 10px 70px; background: var(--c); font: italic 700 32px/1 "Poppins BR"; letter-spacing: 2px; clip-path: polygon(0 0, 100% 0, calc(100% - 28px) 100%, 0 100%); }
  #place { position: absolute; right: 60px; top: 1209px; font: italic 700 28px/1 "Poppins BR"; letter-spacing: 3px; opacity: .85; }
  #ghost { position: absolute; left: -40px; right: -40px; top: 1420px; text-align: center; font: italic 900 260px/0.85 "Barlow Condensed BR"; text-transform: uppercase; color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.08); }
</style>
</head>
<body>
<div id="root" data-composition-id="short-frame" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="30">
  <div id="bg-wrap" class="full"><img id="bg" class="full" src="assets/portrait-bg.jpg" alt=""></div>
  <div id="shade" class="full"></div>
  <div class="slash" id="sl1" style="left:-80px;top:-40px;width:120px;height:600px;opacity:.9"></div>
  <div class="slash" id="sl2" style="left:70px;top:-40px;width:26px;height:600px;opacity:.5"></div>
  <div class="slash" id="sl3" style="right:-80px;top:1180px;width:120px;height:800px;opacity:.9"></div>
  <div class="slash" id="sl4" style="right:70px;top:1180px;width:26px;height:800px;opacity:.5"></div>

  <div id="ambient" class="full" data-layout-allow-overflow data-layout-ignore>
    <div class="orb" id="orb1" style="left:-120px;top:120px;width:520px;height:520px"></div>
    <div class="orb" id="orb2" style="left:640px;top:260px;width:420px;height:420px"></div>
    <div class="orb" id="orb3" style="left:520px;top:1240px;width:560px;height:560px"></div>
    <div class="orb" id="orb4" style="left:-160px;top:1500px;width:460px;height:460px"></div>
    <div id="motes"></div>
  </div>

  <div id="brand"><img id="logo" src="assets/logo.png" alt=""><div id="word">Badminton <span class="red">Records</span></div></div>
  <div id="event" data-var-text="event">TOURNOIS DES VENDANGES 2026</div>
  <div id="detail" data-var-text="detail">DOUBLES HOMMES • QUARTS DE FINALE</div>
  <div id="versus"><span id="s1" data-var-text="s1">TIM &amp; ADRIEN</span><span id="vs">VS</span><span id="s2" data-var-text="s2" style="color:var(--c)">THOMAS &amp; ANTHONY</span></div>

  <div id="window"></div>
  <div class="shine" id="shine-top" style="left:0"></div>
  <div class="shine" id="shine-bot" style="left:0"></div>

  <div id="tag" data-var-text="tag">TOURNOIS</div>
  <div id="place" data-var-text="place">TALENCE · 24 NOVEMBRE 2026</div>
  <div id="ghost">Badminton<br>Records</div>
</div>
<script src="assets/gsap-3.14.2.min.js"></script>
<script>
  const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  const root = document.getElementById("root");
  if (v.colour) root.style.setProperty("--c", v.colour);
  for (const id of ["event", "detail", "place"]) {
    if (id in v && !String(v[id]).trim()) document.getElementById(id).style.display = "none";
  }
  // Long lines shrink to fit the width rather than run off it.
  const fit = (el, min) => {
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && size > min) {
      size -= 2;
      el.style.fontSize = `${size}px`;
    }
  };
  const eventEl = document.getElementById("event");
  eventEl.style.overflow = "hidden";
  fit(eventEl, 30);
  eventEl.style.overflow = "";
  fit(document.getElementById("versus"), 40);

  // Motes: small, dim, slow. Seeded, so every render of a match draws the same ones.
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const host = document.getElementById("motes");
  const motes = [];
  for (let i = 0; i < 28; i++) {
    const top = i % 2 ? 1190 + rnd() * 690 : 150 + rnd() * 390;
    const size = 3 + rnd() * 5;
    const el = document.createElement("div");
    el.className = "mote";
    el.style.cssText = `left:${Math.round(rnd() * 1040 + 20)}px;top:${Math.round(top)}px;width:${size}px;height:${size}px;`
      + `background:${rnd() < 0.35 ? "#fff" : "var(--c)"};box-shadow:0 0 ${Math.round(size * 3)}px var(--c);`;
    host.appendChild(el);
    motes.push({ el, base: 0.25 + rnd() * 0.25, rise: 18 + rnd() * 34, sway: (rnd() - 0.5) * 40, split: 0.3 + rnd() * 0.4, twice: rnd() < 0.4 });
  }

  const mode = String(v.mode ?? "ambient");
  const tl = gsap.timeline({ paused: true });
  // The loop's first frame, which the build-in lands on.
  gsap.set(".slash", { skewX: -24 });
  gsap.set("#bg", { scale: 1.06 });
  motes.forEach(m => gsap.set(m.el, { opacity: m.base }));
  gsap.set(".shine", { x: -400 });

  if (mode === "ambient") {
    const L = 8;
    // The hall breathes: a slow drift there and back.
    tl.to("#bg", { keyframes: [{ x: -14, y: -8, duration: L / 2, ease: "sine.inOut" }, { x: 0, y: 0, duration: L / 2, ease: "sine.inOut" }] }, 0);
    // Glows wander and swell, never more than a tint.
    [["#orb1", 60, 30], ["#orb2", -50, 40], ["#orb3", -70, -30], ["#orb4", 50, -40]].forEach(([id, dx, dy], i) => {
      const a = L * (0.4 + i * 0.05);
      tl.to(id, { keyframes: [{ x: dx, y: dy, opacity: 0.6, duration: a, ease: "sine.inOut" }, { x: 0, y: 0, opacity: 1, duration: L - a, ease: "sine.inOut" }] }, 0);
    });
    // Motes rise a little and settle back, brightening on the way.
    motes.forEach((m) => {
      const cycle = m.twice ? L / 2 : L;
      for (let k = 0; k < L / cycle; k++) {
        const up = cycle * m.split;
        tl.to(m.el, { keyframes: [
          { y: -m.rise, x: m.sway, opacity: Math.min(0.6, m.base * 1.9), duration: up, ease: "sine.inOut" },
          { y: 0, x: 0, opacity: m.base, duration: cycle - up, ease: "sine.inOut" },
        ] }, k * cycle);
      }
    });
    // A light runs along each edge of the window, once a loop, one after the other.
    tl.fromTo("#shine-top", { x: -400 }, { x: 1480, duration: 4.5, ease: "sine.inOut" }, 0.3);
    tl.fromTo("#shine-bot", { x: 1480 }, { x: -400, duration: 4.5, ease: "sine.inOut" }, 3.4);
    tl.set({}, {}, L);
  }
  else if (mode === "in") {
    // Each piece arrives its own way: the hall zooms out of a blur, the window
    // opens, the brand punches in, lines track and slide, the players fly in.
    tl.fromTo("#bg", { scale: 1.25, opacity: 0, filter: "blur(18px)" }, { scale: 1.06, opacity: 0.72, filter: "blur(0px)", duration: 1.1, ease: "power3.out" }, 0);
    tl.fromTo("#shade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
    tl.fromTo("#window", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0);
    tl.fromTo(["#sl1", "#sl2"], { x: -320, skewX: -40 }, { x: 0, skewX: -24, duration: 0.6, ease: "expo.out", stagger: 0.07 }, 0.05);
    tl.fromTo(["#sl3", "#sl4"], { x: 320, skewX: -40 }, { x: 0, skewX: -24, duration: 0.6, ease: "expo.out", stagger: 0.07 }, 0.1);
    tl.fromTo(".orb", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.1);
    tl.fromTo("#logo", { scale: 2.2, rotation: -12, opacity: 0, filter: "blur(12px)" }, { scale: 1, rotation: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.6)" }, 0.12);
    tl.fromTo("#word", { x: 60, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0.22);
    tl.fromTo("#event", { y: 34, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0.32);
    tl.fromTo("#detail", { letterSpacing: "22px", opacity: 0 }, { letterSpacing: "3px", opacity: 1, duration: 0.55, ease: "expo.out" }, 0.4);
    tl.fromTo("#s1", { x: -560, opacity: 0, filter: "blur(14px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.48);
    tl.fromTo("#s2", { x: 560, opacity: 0, filter: "blur(14px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.48);
    tl.fromTo("#vs", { scale: 2.6, rotation: 18, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0.66);
    tl.fromTo("#tag", { x: -520 }, { x: 0, duration: 0.5, ease: "expo.out" }, 0.55);
    tl.fromTo("#place", { x: 80, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 0.85, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0.62);
    tl.fromTo("#ghost", { scale: 1.15, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 0.55);
    tl.fromTo(".mote", { opacity: 0 }, { opacity: (i) => motes[i].base, duration: 0.6, ease: "power2.out", stagger: 0.012 }, 0.6);
    tl.set({}, {}, 1.4);
  }
  window.__timelines["short-frame"] = tl;
</script>
</body>
</html>
