<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"colour","type":"color","label":"Family colour","default":"#cb2543"},
    {"id":"s1","type":"string","label":"Side 1","default":"TIM & ADRIEN"},
    {"id":"s2","type":"string","label":"Side 2","default":"THOMAS & ANTHONY"},
    {"id":"sets","type":"string","label":"Set scores (21-17,19-21)","default":"21-17,19-21,21-15"},
    {"id":"winner","type":"string","label":"Winner side (1, 2 or empty)","default":"1"},
    {"id":"detail","type":"string","label":"Event line","default":"TOURNOIS DES VENDANGES 2026 · QUARTS DE FINALE"}
  ]'
>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Barlow Condensed BR"; src: url("assets/fonts/BarlowCondensed-BlackItalic.ttf"); font-weight: 900; font-style: italic; }
  @font-face { font-family: "Poppins BR"; src: url("assets/fonts/Poppins-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
  html, body { margin: 0; background: transparent; }
  /* Transparent: laid over the match's starred rallies, slowed and darkened by the render. */
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; --c: #cb2543; color: #fff; }

  #result { position: absolute; left: 0; right: 0; top: 250px; display: flex; flex-direction: column; align-items: center; }
  #r-tag { padding: 12px 60px 10px; background: var(--c); font: italic 700 40px/1 "Poppins BR"; letter-spacing: 4px; clip-path: polygon(24px 0, 100% 0, calc(100% - 24px) 100%, 0 100%); }
  #r-detail { margin-top: 26px; font: italic 700 34px/1 "Poppins BR"; letter-spacing: 3px; opacity: .85; }
  #table { margin-top: 40px; background: rgba(8,7,10,.82); border-left: 10px solid var(--c); padding: 18px 40px 18px 30px; }
  .row { display: flex; align-items: center; gap: 40px; padding: 10px 0; }
  .row .name { width: 720px; font: italic 900 92px/1 "Barlow Condensed BR"; text-transform: uppercase; }
  .row .set { width: 110px; text-align: center; font: italic 900 92px/1 "Barlow Condensed BR"; opacity: .45; }
  .row .set.won { opacity: 1; color: var(--c); }
  .row.loser .name { opacity: .55; }

  /* End screen: Tim drags YouTube's elements onto these frames once, then imports them. */
  #end { position: absolute; inset: 0; }
  #e-logo { position: absolute; left: 50%; top: 48px; height: 130px; margin-left: -65px; }
  .frame { position: absolute; border: 8px solid var(--c); box-sizing: border-box; }
  #sub { left: 400px; top: 440px; width: 320px; height: 320px; border-radius: 50%; }
  #v1 { left: 1000px; top: 236px; width: 576px; height: 324px; }
  #v2 { left: 1000px; top: 640px; width: 576px; height: 324px; }
  .label { position: absolute; font: italic 700 36px/1 "Poppins BR"; letter-spacing: 3px; }
  #l-sub { left: 400px; width: 320px; top: 790px; text-align: center; }
  #l-v1 { left: 1000px; top: 190px; }
  #l-v2 { left: 1000px; top: 594px; }
  #e-thanks { position: absolute; left: 140px; top: 260px; width: 840px; text-align: center; font: italic 900 96px/0.9 "Barlow Condensed BR"; text-transform: uppercase; }
  #e-thanks span { color: var(--c); }
</style>
</head>
<body>
<div id="root" data-composition-id="outro" data-start="0" data-duration="15" data-width="1920" data-height="1080" data-fps="30">
  <div id="result">
    <div id="r-tag">RÉSULTAT</div>
    <div id="r-detail" data-var-text="detail">TOURNOIS DES VENDANGES 2026 · QUARTS DE FINALE</div>
    <div id="table">
      <div class="row" id="row1"><div class="name" id="n1" data-var-text="s1">TIM &amp; ADRIEN</div></div>
      <div class="row" id="row2"><div class="name" id="n2" data-var-text="s2">THOMAS &amp; ANTHONY</div></div>
    </div>
  </div>

  <div id="end">
    <img id="e-logo" src="assets/logo.png" alt="">
    <div id="e-thanks">Merci <span>d'avoir regardé</span></div>
    <div class="frame" id="sub"></div>
    <div class="frame" id="v1"></div>
    <div class="frame" id="v2"></div>
    <div class="label" id="l-sub">S'ABONNER</div>
    <div class="label" id="l-v1">MATCH SUIVANT</div>
    <div class="label" id="l-v2">PLUS DE MATCHS</div>
  </div>
</div>
<script src="assets/gsap-3.14.2.min.js"></script>
<script>
  const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  const root = document.getElementById("root");
  if (v.colour) root.style.setProperty("--c", v.colour);
  if ("detail" in v && !String(v.detail).trim()) document.getElementById("r-detail").style.display = "none";

  // Set columns, built once from the scores; the winner of each set is lit.
  const sets = String(v.sets ?? "21-17,19-21,21-15").split(",").map(s => s.split("-").map(Number)).filter(s => s.length === 2 && s.every(Number.isFinite));
  const winner = String(v.winner ?? "1");
  for (const side of [0, 1]) {
    const row = document.getElementById(`row${side + 1}`);
    if (winner && winner !== String(side + 1)) row.classList.add("loser");
    sets.forEach((score, i) => {
      const cell = document.createElement("div");
      cell.className = "set" + (score[side] > score[1 - side] ? " won" : "");
      cell.id = `set${side}${i}`;
      cell.textContent = String(score[side]);
      row.appendChild(cell);
    });
  }

  const tl = gsap.timeline({ paused: true });
  // Result: 0.2 → 5.2 s.
  tl.fromTo("#r-tag", { x: -400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.2);
  tl.fromTo("#r-detail", { opacity: 0, filter: "blur(8px)" }, { opacity: 0.85, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.4);
  tl.fromTo("#table", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.45);
  tl.fromTo(".row .name", { x: -60, opacity: 0 }, { x: 0, opacity: (i, el) => (el.parentElement.classList.contains("loser") ? 0.55 : 1), duration: 0.35, ease: "expo.out", stagger: 0.08 }, 0.7);
  tl.fromTo(".row .set", { y: 30, opacity: 0 }, { y: 0, opacity: (i, el) => (el.classList.contains("won") ? 1 : 0.45), duration: 0.3, ease: "expo.out", stagger: 0.06 }, 0.9);
  tl.to("#result", { opacity: 0, filter: "blur(10px)", y: -40, duration: 0.25, ease: "power3.in" }, 5.0);

  // End screen: 5.4 s → end. YouTube needs its elements on screen 5–20 s; these hold 9 s.
  tl.fromTo("#e-logo", { scale: 1.8, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 5.4);
  tl.fromTo("#sub", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "expo.out" }, 5.55);
  tl.fromTo("#v1", { x: 700, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 5.65);
  tl.fromTo("#v2", { x: 700, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 5.75);
  tl.fromTo(["#l-sub", "#l-v1", "#l-v2"], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", stagger: 0.08 }, 6.0);
  tl.fromTo("#e-thanks", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 5.5);
  window.__timelines["outro"] = tl;
</script>
</body>
</html>
