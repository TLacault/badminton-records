<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"colour","type":"color","label":"Family colour","default":"#cb2543"},
    {"id":"tag","type":"string","label":"Family tag","default":"TOURNOIS"},
    {"id":"event","type":"string","label":"Event line","default":"TOURNOIS DES VENDANGES 2026"},
    {"id":"detail","type":"string","label":"Discipline • round","default":"DOUBLES HOMMES • QUARTS DE FINALE"},
    {"id":"s1a","type":"string","label":"Side 1 player 1","default":"TIM LACAULT"},
    {"id":"s1b","type":"string","label":"Side 1 player 2","default":"ADRIEN ROUX"},
    {"id":"s2a","type":"string","label":"Side 2 player 1","default":"THOMAS MARTIN"},
    {"id":"s2b","type":"string","label":"Side 2 player 2","default":"ANTHONY LEROY"},
    {"id":"place","type":"string","label":"Venue · date","default":"TALENCE · 24 NOVEMBRE 2026"},
    {"id":"details","type":"string","label":"Match card (1 / 0; 0 wipes out after the brand, cut at 3.5 s)","default":"1"},
    {"id":"highlights","type":"string","label":"Word under the brand (clips: HIGHLIGHTS; empty for the full match)","default":""}
  ]'
>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Barlow Condensed BR"; src: url("assets/fonts/BarlowCondensed-BlackItalic.ttf"); font-weight: 900; font-style: italic; }
  @font-face { font-family: "Poppins BR"; src: url("assets/fonts/Poppins-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
  html, body { margin: 0; background: #08070a; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #08070a; --c: #cb2543; color: #fff; }
  .full { position: absolute; inset: 0; }
  #bg-wrap img { width: 100%; height: 100%; object-fit: cover; }
  #shade { background: radial-gradient(70% 70% at 50% 45%, rgba(8,7,10,.55), rgba(8,7,10,.92)); }
  .slash { position: absolute; top: -200px; height: 1480px; background: var(--c); }
  #brand { position: absolute; left: 0; right: 0; top: 230px; display: flex; flex-direction: column; align-items: center; }
  #logo { height: 400px; }
  #word { margin-top: 18px; font: italic 900 120px/0.86 "Barlow Condensed BR"; text-transform: uppercase; text-align: center; letter-spacing: .01em; }
  #word span { display: inline-block; }
  #word .red { color: var(--c); }
  #hl { position: relative; margin-top: 30px; width: 1200px; text-align: center; display: none; }
  .hl-t { font: italic 900 150px/1 "Barlow Condensed BR"; letter-spacing: .04em; white-space: nowrap; }
  #hl-text { position: relative; color: var(--c); text-shadow: 0 0 48px color-mix(in srgb, var(--c) 70%, transparent); }
  #hl-shine { position: absolute; inset: 0; color: transparent; background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%) no-repeat; background-size: 300% 100%; background-position: 120% 0; -webkit-background-clip: text; background-clip: text; }
  #hl-line { position: absolute; left: -200px; right: -200px; top: 50%; height: 6px; margin-top: -3px; background: linear-gradient(90deg, transparent, #fff 50%, transparent); box-shadow: 0 0 28px 8px color-mix(in srgb, var(--c) 70%, transparent); }
  #hl-core { position: absolute; left: 50%; top: 50%; width: 380px; height: 380px; margin: -190px 0 0 -190px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, rgba(255,255,255,.7) 10%, color-mix(in srgb, var(--c) 50%, transparent) 30%, transparent 65%); }
  #card { position: absolute; inset: 0; }
  #tag { position: absolute; left: 0; top: 96px; padding: 14px 70px 12px 120px; background: var(--c); font: italic 700 44px/1 "Poppins BR"; letter-spacing: 2px; clip-path: polygon(0 0, 100% 0, calc(100% - 40px) 100%, 0 100%); }
  #event { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font: italic 700 64px/1.1 "Poppins BR"; letter-spacing: 2px; }
  #detail { position: absolute; left: 0; right: 0; top: 335px; text-align: center; font: italic 700 40px/1.1 "Poppins BR"; letter-spacing: 3px; color: var(--c); }
  #versus { position: absolute; left: 70px; right: 70px; top: 450px; display: grid; grid-template-columns: 1fr 220px 1fr; align-items: center; }
  .side { min-width: 0; font: italic 900 104px/0.95 "Barlow Condensed BR"; text-transform: uppercase; }
  .side div { white-space: nowrap; }
  #side1 { text-align: right; }
  #side2 { text-align: left; color: var(--c); }
  #vs { text-align: center; font: italic 900 150px/1 "Barlow Condensed BR"; color: #fff; -webkit-text-stroke: 0; }
  #place { position: absolute; right: 0; top: 880px; padding: 22px 120px 20px 90px; background: var(--c); font: italic 700 40px/1 "Poppins BR"; letter-spacing: 3px; clip-path: polygon(40px 0, 100% 0, 100% 100%, 0 100%); }
  #corner { position: absolute; left: 60px; top: 60px; height: 0; }
  #wipe .slash { top: -300px; height: 1680px; }
</style>
</head>
<body>
<div id="root" data-composition-id="intro" data-start="0" data-duration="6" data-width="1920" data-height="1080" data-fps="30">
  <div id="bg-wrap" class="full"><img id="bg" src="assets/background.jpg" alt=""></div>
  <div id="shade" class="full"></div>

  <div id="slashes" class="full" data-layout-allow-overflow data-layout-ignore>
    <div class="slash" id="sl1" style="left:-260px;width:240px"></div>
    <div class="slash" id="sl2" style="left:-120px;width:60px;opacity:.6"></div>
    <div class="slash" id="sl3" style="right:-260px;width:240px"></div>
    <div class="slash" id="sl4" style="right:-120px;width:60px;opacity:.6"></div>
  </div>

  <div id="brand">
    <img id="logo" src="assets/logo.png" alt="">
    <div id="word"><span id="w1">Badminton</span> <span id="w2" class="red">Records</span></div>
    <div id="hl" data-layout-allow-overflow>
      <div id="hl-line"></div>
      <div id="hl-text" class="hl-t" data-var-text="highlights">HIGHLIGHTS</div>
      <div id="hl-shine" class="hl-t" aria-hidden="true">HIGHLIGHTS</div>
      <div id="hl-core"></div>
    </div>
  </div>

  <div id="card">
    <div id="tag"><span id="tag-t" data-var-text="tag">TOURNOIS</span></div>
    <div id="event" data-var-text="event">TOURNOIS DES VENDANGES 2026</div>
    <div id="detail" data-var-text="detail">DOUBLES HOMMES • QUARTS DE FINALE</div>
    <div id="versus">
      <div id="side1" class="side"><div id="s1a" data-var-text="s1a">TIM LACAULT</div><div id="s1b" data-var-text="s1b">ADRIEN ROUX</div></div>
      <div id="vs">VS</div>
      <div id="side2" class="side"><div id="s2a" data-var-text="s2a">THOMAS MARTIN</div><div id="s2b" data-var-text="s2b">ANTHONY LEROY</div></div>
    </div>
    <div id="place" data-var-text="place">TALENCE · 24 NOVEMBRE 2026</div>
  </div>

  <div id="wipe" class="full" data-layout-allow-overflow data-layout-ignore>
    <div class="slash" id="wp1" style="left:0;width:900px"></div>
    <div class="slash" id="wp2" style="left:-300px;width:2600px;background:#08070a"></div>
  </div>
</div>

<script src="assets/gsap-3.14.2.min.js"></script>
<script>
  const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  const root = document.getElementById("root");
  if (v.colour) root.style.setProperty("--c", v.colour);
  // Empty lines collapse: singles have one name a side, a free-play card has no event.
  for (const id of ["s1b", "s2b", "event", "place"]) {
    const el = document.getElementById(id);
    if (id in v && !String(v[id]).trim()) el.style.display = "none";
  }

  // Long names shrink to fit their half rather than wrap into a third line.
  for (const id of ["s1a", "s1b", "s2a", "s2b"]) {
    const el = document.getElementById(id);
    el.style.overflow = "hidden";
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && size > 56) {
      size -= 2;
      el.style.fontSize = `${size}px`;
    }
    el.style.overflow = "";
  }

  // details=0 (a clip without the match card): brand only, wipe at 2.85 s, the render is cut at 3.5 s.
  const details = String(v.details ?? "1") !== "0";
  if (!details) document.getElementById("card").style.display = "none";

  // A clip's intro adds a word under the brand (HIGHLIGHTS); the full match has none.
  const highlights = String(v.highlights ?? "").trim();
  if (highlights) {
    document.getElementById("hl").style.display = "block";
    document.getElementById("hl-text").textContent = highlights;
    document.getElementById("hl-shine").textContent = highlights;
    document.getElementById("brand").style.top = "150px";
  }

  const tl = gsap.timeline({ paused: true });
  // The hall behind, pushed in slowly the whole time.
  tl.fromTo("#bg", { scale: 1.08 }, { scale: 1.0, duration: 6, ease: "none" }, 0);

  // Brush slashes sweep in from both edges.
  tl.fromTo("#sl1", { x: -500, skewX: -24 }, { x: 160, skewX: -24, duration: 0.5, ease: "expo.out" }, 0.05);
  tl.fromTo("#sl2", { x: -500, skewX: -24 }, { x: 340, skewX: -24, duration: 0.55, ease: "expo.out" }, 0.12);
  tl.fromTo("#sl3", { x: 500, skewX: -24 }, { x: -160, skewX: -24, duration: 0.5, ease: "expo.out" }, 0.05);
  tl.fromTo("#sl4", { x: 500, skewX: -24 }, { x: -340, skewX: -24, duration: 0.55, ease: "expo.out" }, 0.12);

  // Logo slams in, the name snaps under it.
  tl.fromTo("#logo", { scale: 2.6, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 0.3);
  tl.fromTo("#brand", { x: 0 }, { x: 0, keyframes: [{ x: -10, duration: 0.04 }, { x: 8, duration: 0.04 }, { x: -4, duration: 0.04 }, { x: 0, duration: 0.04 }] }, 0.62);
  tl.fromTo("#w1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out" }, 0.72);
  tl.fromTo("#w2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out" }, 0.8);

  // HIGHLIGHTS (clips only): a light line opens, the word punches in, a flare crosses it.
  tl.fromTo("#hl-line", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 1.0);
  tl.to("#hl-line", { opacity: 0.25, duration: 0.5, ease: "power2.out" }, 1.35);
  tl.fromTo("#hl-text", { scale: 1.5, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 1.05);
  tl.fromTo("#hl-core", { x: -640, scale: 0.4, opacity: 0 }, { x: 640, scale: 1.1, duration: 0.75, ease: "power2.inOut" }, 1.1);
  tl.to("#hl-core", { keyframes: [{ opacity: 1, duration: 0.2 }, { opacity: 1, duration: 0.35 }, { opacity: 0, duration: 0.2 }] }, 1.1);
  tl.fromTo("#hl-shine", { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: 0.65, ease: "power2.inOut" }, 1.2);

  // The brand clears the stage for the card; the slashes widen into a frame.
  // Without the card the brand holds until the wipe.
  if (details) tl.to("#brand", { y: -60, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, 1.9);
  tl.to(["#sl1", "#sl3"], { opacity: 0.35, duration: 0.4, ease: "power2.inOut" }, 1.9);

  // Match card.
  tl.fromTo("#tag", { x: -700 }, { x: 0, duration: 0.45, ease: "expo.out" }, 2.15);
  tl.fromTo("#event", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 2.3);
  tl.fromTo("#detail", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 2.4);
  tl.fromTo("#side1", { x: -900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 2.5);
  tl.fromTo("#side2", { x: 900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 2.5);
  tl.fromTo("#vs", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 2.75);
  tl.fromTo("#place", { x: 900 }, { x: 0, duration: 0.45, ease: "expo.out" }, 2.9);

  // Out: a colour wipe covers the frame and the match cuts in behind it.
  tl.fromTo("#wp1", { x: -1400, skewX: -24 }, { x: 2600, skewX: -24, duration: 0.55, ease: "power3.in" }, details ? 5.3 : 2.85);
  // Ink follows the colour and holds the last frames dark: the match cuts in from black.
  tl.fromTo("#wp2", { x: -3200, skewX: -24 }, { x: 0, skewX: -24, duration: 0.5, ease: "power3.in" }, details ? 5.42 : 2.97);

  window.__timelines["intro"] = tl;
</script>
</body>
</html>
